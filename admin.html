
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AquaFind Admin Dashboard</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f1f6fa;
            color: #183247;
        }

        header {
            background: #0878b9;
            color: white;
            padding: 22px 7%;
        }

        header h1 {
            font-size: 27px;
        }

        header p {
            margin-top: 7px;
            opacity: 0.9;
        }

        .container {
            width: 90%;
            max-width: 1150px;
            margin: 30px auto;
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 25px;
        }

        .topbar a {
            background: #0878b9;
            color: white;
            text-decoration: none;
            padding: 11px 18px;
            border-radius: 7px;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 18px;
            margin-bottom: 25px;
        }

        .stat-card {
            background: white;
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 3px 12px #0000000c;
            border-left: 5px solid #0878b9;
        }

        .stat-card h3 {
            color: #607586;
            font-size: 15px;
        }

        .stat-card p {
            font-size: 32px;
            font-weight: bold;
            margin-top: 12px;
        }

        .panel {
            background: white;
            padding: 22px;
            border-radius: 12px;
            box-shadow: 0 3px 12px #0000000c;
        }

        .panel h2 {
            margin-bottom: 18px;
        }

        #searchInput {
            width: 100%;
            padding: 13px;
            border: 1px solid #cbd8e2;
            border-radius: 7px;
            margin-bottom: 20px;
            font-size: 15px;
        }

        .complaint {
            border: 1px solid #dce6ed;
            border-radius: 9px;
            padding: 17px;
            margin-bottom: 14px;
        }

        .complaint h3 {
            margin-bottom: 9px;
            color: #0878b9;
        }

        .complaint p {
            margin: 7px 0;
            line-height: 1.5;
            overflow-wrap: anywhere;
        }

        .status {
            display: inline-block;
            padding: 6px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            margin: 8px 0;
        }

        .pending {
            background: #fff0c2;
            color: #805b00;
        }

        .resolved {
            background: #d8f5e2;
            color: #176b38;
        }

        select, button {
            padding: 10px 13px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            margin: 5px 5px 0 0;
        }

        select {
            border: 1px solid #cbd8e2;
            background: white;
        }

        .delete-btn {
            background: #d94343;
            color: white;
        }

        .empty {
            text-align: center;
            color: #718391;
            padding: 30px 10px;
        }

        footer {
            text-align: center;
            padding: 25px;
            color: #718391;
        }

        @media (max-width: 650px) {
            .stats {
                grid-template-columns: 1fr;
            }

            .container {
                width: 94%;
            }

            .panel {
                padding: 15px;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>AquaFind Admin Dashboard</h1>
    <p>Manage drinking water complaints</p>
</header>

<main class="container">

    <div class="topbar">
        <h2>Dashboard Overview</h2>
        <a href="index.html">← Back to AquaFind</a>
    </div>

    <section class="stats">
        <div class="stat-card">
            <h3>Total Complaints</h3>
            <p id="totalCount">0</p>
        </div>

        <div class="stat-card">
            <h3>Pending Complaints</h3>
            <p id="pendingCount">0</p>
        </div>

        <div class="stat-card">
            <h3>Resolved Complaints</h3>
            <p id="resolvedCount">0</p>
        </div>
    </section>

    <section class="panel">
        <h2>Complaint Management</h2>

        <input
            type="text"
            id="searchInput"
            placeholder="Search by name or complaint type..."
        >

        <div id="complaintList"></div>
    </section>

</main>

<footer>
    AquaFind Smart Drinking Water Locator System
</footer>

<script>
    const STORAGE_KEY = "aquafindComplaints";

    function getComplaints() {
        try {
            const data = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
            return Array.isArray(data) ? data : [];
        } catch (error) {
            return [];
        }
    }

    function saveComplaints(complaints) {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(complaints));
    }

    function updateDashboard() {
        const complaints = getComplaints();

        const pending = complaints.filter(
            item => (item.status || "Pending") === "Pending"
        ).length;

        const resolved = complaints.filter(
            item => item.status === "Resolved"
        ).length;

        document.getElementById("totalCount").textContent =
            complaints.length;

        document.getElementById("pendingCount").textContent =
            pending;

        document.getElementById("resolvedCount").textContent =
            resolved;

        displayComplaints();
    }

    function displayComplaints() {
        const complaints = getComplaints();
        const search = document.getElementById("searchInput")
            .value.toLowerCase();

        const list = document.getElementById("complaintList");

        const filtered = complaints
            .map((item, index) => ({ ...item, originalIndex: index }))
            .filter(item =>
                String(item.name || "").toLowerCase().includes(search) ||
                String(item.problem || "").toLowerCase().includes(search) ||
                String(item.description || "").toLowerCase().includes(search)
            );

        if (filtered.length === 0) {
            list.innerHTML = `
                <div class="empty">
                    No complaints found.
                </div>
            `;
            return;
        }

        list.innerHTML = filtered.map(item => {
            const status = item.status || "Pending";
            const safeName = escapeHTML(item.name || "Not provided");
            const safeProblem = escapeHTML(item.problem || "Not specified");
            const safeDescription = escapeHTML(
                item.description || "No description"
            );
            const safeDate = escapeHTML(item.date || "Date unavailable");

            return `
                <div class="complaint">
                    <h3>${safeProblem}</h3>

                    <p><strong>Name:</strong> ${safeName}</p>
                    <p><strong>Description:</strong> ${safeDescription}</p>
                    <p><strong>Date:</strong> ${safeDate}</p>

                    <span class="status ${
                        status === "Resolved" ? "resolved" : "pending"
                    }">${escapeHTML(status)}</span>

                    <br>

                    <label>Update status: </label>

                    <select onchange="changeStatus(${item.originalIndex}, this.value)">
                        <option value="Pending" ${
                            status === "Pending" ? "selected" : ""
                        }>Pending</option>

                        <option value="Resolved" ${
                            status === "Resolved" ? "selected" : ""
                        }>Resolved</option>
                    </select>

                    <button class="delete-btn"
                        onclick="deleteComplaint(${item.originalIndex})">
                        Delete
                    </button>
                </div>
            `;
        }).join("");
    }

    function escapeHTML(value) {
        return String(value).replace(/[&<>"']/g, character => ({
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#039;"
        })[character]);
    }

    function changeStatus(index, newStatus) {
        const complaints = getComplaints();

        if (!complaints[index]) return;

        complaints[index].status = newStatus;
        saveComplaints(complaints);
        updateDashboard();
    }

    function deleteComplaint(index) {
        if (!confirm("Are you sure you want to delete this complaint?")) {
            return;
        }

        const complaints = getComplaints();
        complaints.splice(index, 1);

        saveComplaints(complaints);
        updateDashboard();
    }

    document.getElementById("searchInput")
        .addEventListener("input", displayComplaints);

    updateDashboard();
</script>

</body>
</html>
